name: Release

# Push a tag like v0.1.0 to build every platform and publish a GitHub release.
# "Run workflow" from the Actions tab does a dry run: it builds and uploads artifacts but creates no release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version for the dry run (no leading v)
        default: 0.0.0-dev
        required: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  # The tag without its leading v, or the dry-run input.
  VERSION: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    steps:
      # Installs compare versions to find updates (design/10-自动更新.md §3): a release tag must be vX.Y.Z or vX.Y.Z-preview.N.
      - name: Check the tag
        if: github.ref_type == 'tag'
        run: |
          if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-preview\.[0-9]+)?$ ]]; then
            echo "::error::$GITHUB_REF_NAME is not a release tag (expected vX.Y.Z or vX.Y.Z-preview.N)"
            exit 1
          fi

  macos:
    name: macOS (${{ matrix.rid }})
    needs: version
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        rid: [osx-arm64, osx-x64]
    env:
      # Repository secrets. Without APPLE_CERTIFICATE the dmg is only ad-hoc signed (not notarized).
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Import Developer ID certificate
        if: env.APPLE_CERTIFICATE != ''
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          # shellcheck disable=SC2046  # splitting the existing keychain list is intended
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/certificate.p12"
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | awk '/Developer ID Application/ {print $2; exit}')"
          [ -n "$IDENTITY" ] || { echo "no Developer ID Application identity in the certificate" >&2; exit 1; }
          echo "SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "NOTARIZE=1" >> "$GITHUB_ENV"

      - name: Warn when unsigned
        if: env.APPLE_CERTIFICATE == ''
        run: |
          echo "::warning::APPLE_CERTIFICATE is not set, so this dmg is only ad-hoc signed and NOT notarized."

      - name: Package
        run: tools/package-macos.sh "${{ matrix.rid }}" "${VERSION#v}" dist

      - uses: actions/upload-artifact@v4
        with:
          name: octopus-${{ matrix.rid }}
          # The .zip is the update package of installed copies.
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error

  windows:
    name: Windows (win-x64)
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Publish
        shell: bash
        run: |
          V="${VERSION#v}"
          # NativeAOT (Octopus.App.csproj); the stripped symbols (.pdb) are not shipped.
          dotnet publish src/Octopus.App -c Release -r win-x64 \
            -p:Version="$V" -p:DebugType=None -p:DebugSymbols=false -o build/win-x64
          rm -f build/win-x64/*.pdb build/win-x64/*.xml

      - name: Portable zip
        shell: pwsh
        run: |
          $v = $env:VERSION.TrimStart('v')
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build/win-x64 "build/Octopus-$v-win-x64" -Recurse
          $zipPath = "$PWD/dist/Octopus-$v-win-x64.zip"
          if (Get-Command 7z -ErrorAction SilentlyContinue) {
            Push-Location build
            7z a -tzip -mx=9 "$zipPath" "Octopus-$v-win-x64"
            if ($LASTEXITCODE -ne 0) { throw "7z failed with $LASTEXITCODE" }
            Pop-Location
          } else {
            Compress-Archive -Path "build/Octopus-$v-win-x64" -DestinationPath $zipPath -CompressionLevel Optimal
          }

      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          $v = $env:VERSION.TrimStart('v')
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue)?.Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          & $iscc "/DAppVersion=$v" "/DSourceDir=$PWD\build\win-x64" "/DOutputDir=$PWD\dist" packaging/windows/octopus.iss
          if ($LASTEXITCODE -ne 0) { throw "iscc failed with $LASTEXITCODE" }

      - name: Smoke-test the installer (custom directory, then uninstall)
        shell: pwsh
        run: |
          $v = $env:VERSION.TrimStart('v')
          $dir = Join-Path $env:RUNNER_TEMP 'octopus install dir'
          # The path has spaces on purpose: Inno needs /DIR="..." quoted, and Start-Process does not quote array items.
          $dirArg = '/DIR="' + $dir + '"'
          $p = Start-Process "dist/Octopus-$v-win-x64-setup.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/CURRENTUSER',$dirArg -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "setup exited with $($p.ExitCode)" }
          if (-not (Test-Path "$dir\Octopus.exe")) { throw "Octopus.exe was not installed into $dir" }
          $hooksDir = Join-Path $env:USERPROFILE '.gemini\config'
          $hooksPath = Join-Path $hooksDir 'hooks.json'
          New-Item -ItemType Directory -Force $hooksDir | Out-Null
          '{"octopus":{"Stop":[{"type":"command","command":"echo {}"}]},"keep":{"Stop":[]}}' | Set-Content -LiteralPath $hooksPath -Encoding UTF8
          $p = Start-Process "$dir\unins000.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "uninstaller exited with $($p.ExitCode)" }
          Start-Sleep -Seconds 2
          if (Test-Path "$dir\Octopus.exe") { throw "Octopus.exe is still there after uninstall" }
          $hooksAfter = Get-Content -LiteralPath $hooksPath -Raw | ConvertFrom-Json
          if ($null -ne $hooksAfter.octopus) { throw "octopus hook entry was not cleaned up on uninstall" }
          if ($null -eq $hooksAfter.keep) { throw "existing user hook entry was removed on uninstall" }
          Remove-Item -LiteralPath $hooksPath -Force

      - uses: actions/upload-artifact@v4
        with:
          name: octopus-win-x64
          path: |
            dist/*.zip
            dist/*-setup.exe
          if-no-files-found: error

  linux:
    name: Linux (linux-x64)
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Publish and pack
        run: |
          V="${VERSION#v}"
          # NativeAOT (Octopus.App.csproj); the stripped symbols (.dbg) are not shipped.
          dotnet publish src/Octopus.App -c Release -r linux-x64 \
            -p:Version="$V" -p:DebugType=None -p:DebugSymbols=false -o build/linux-x64
          rm -f build/linux-x64/*.dbg build/linux-x64/*.pdb build/linux-x64/*.xml
          mkdir -p dist
          # Portable archive (keep .tar.gz filename for release server / website compatibility; use max gzip level)
          cp -R build/linux-x64 "build/Octopus-$V-linux-x64"
          GZIP=-9 tar -C build -czf "dist/Octopus-$V-linux-x64.tar.gz" "Octopus-$V-linux-x64"
          # Installer that asks for the install directory
          tools/package-linux.sh "$V" build/linux-x64 dist

      - name: Smoke-test the installer (custom directory, then uninstall)
        run: |
          V="${VERSION#v}"
          export HOME="$RUNNER_TEMP/home"; mkdir -p "$HOME"
          DIR="$RUNNER_TEMP/octopus install dir"
          "dist/Octopus-$V-linux-x64.run" --prefix "$DIR"
          test -x "$DIR/Octopus"
          test -L "$HOME/.local/bin/octopus"
          mkdir -p "$HOME/.gemini/config"
          printf '{"octopus":{"Stop":[{"type":"command","command":"echo {}"}]},"keep":{"Stop":[]}}\n' > "$HOME/.gemini/config/hooks.json"
          "$DIR/uninstall.sh"
          test ! -e "$DIR"
          test ! -e "$HOME/.local/bin/octopus"
          grep -q '"keep"' "$HOME/.gemini/config/hooks.json"
          ! grep -q '"octopus"' "$HOME/.gemini/config/hooks.json"

      - uses: actions/upload-artifact@v4
        with:
          name: octopus-linux-x64
          path: |
            dist/*.tar.gz
            dist/*.run
          if-no-files-found: error

  # The phone app's APK (design/10-自动更新.md §15). With the secrets ANDROID_KEYSTORE, ANDROID_KEYSTORE_PASSWORD and
  # ANDROID_KEY_ALIAS (tools/make-android-keystore.sh) it is signed with the release key, named Octopus-<v>-android.apk,
  # and listed in update.json: the app updates itself to it, and an install of it updates in place. Without them it is
  # signed with a throw-away debug key and named Octopus-<v>-android-debug.apk, which no manifest lists (it cannot
  # install over anything, so it must never be offered as an update).
  android:
    name: Android (apk)
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '21'

      - name: Install the android workload
        run: dotnet workload install android

      # MSBuild reads environment variables as properties, case-insensitively: VERSION (v1.2.3 on a tag) would become
      # $(Version) and fail the restore. Every dotnet call here passes Version explicitly.
      - name: Android SDK packages
        run: >
          dotnet build src/Octopus.Mobile.Android -t:InstallAndroidDependencies -p:Version="${VERSION#v}"
          -p:AndroidSdkDirectory="$ANDROID_HOME" -p:JavaSdkDirectory="$JAVA_HOME" -p:AcceptAndroidSDKLicenses=True

      - name: Publish
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          V="${VERSION#v}"
          # versionName is the release's version; versionCode has to be an integer that grows: major·10⁷ + minor·10⁵ + patch.
          IFS=. read -r MAJOR MINOR PATCH <<< "${V%%-*}"
          CODE=$(( MAJOR * 10000000 + MINOR * 100000 + PATCH ))
          SIGNING=()
          NAME="Octopus-$V-android-debug.apk"
          if [ -n "$ANDROID_KEYSTORE" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ]; then
            STORE="$RUNNER_TEMP/octopus-release.keystore"
            ( umask 077; printf '%s' "$ANDROID_KEYSTORE" | base64 -d > "$STORE" )
            # The passwords are read from the environment (env:NAME), so they never appear on a command line.
            SIGNING=(-p:AndroidKeyStore=true -p:AndroidSigningKeyStore="$STORE" -p:AndroidSigningKeyAlias="$ANDROID_KEY_ALIAS"
                     -p:AndroidSigningStorePass=env:ANDROID_KEYSTORE_PASSWORD -p:AndroidSigningKeyPass=env:ANDROID_KEYSTORE_PASSWORD)
            NAME="Octopus-$V-android.apk"
          else
            echo "::warning::ANDROID_KEYSTORE is not set: the APK is debug-signed ($NAME), not in update.json, and cannot install over an earlier one."
          fi
          dotnet publish src/Octopus.Mobile.Android -c Release -p:Version="$V" \
            -p:AndroidSdkDirectory="$ANDROID_HOME" -p:JavaSdkDirectory="$JAVA_HOME" \
            -p:ApplicationDisplayVersion="$V" -p:ApplicationVersion="$CODE" "${SIGNING[@]}" -o build/android
          rm -f "$RUNNER_TEMP/octopus-release.keystore"
          mkdir -p dist
          cp build/android/*-Signed.apk "dist/$NAME"

      - uses: actions/upload-artifact@v4
        with:
          name: octopus-android
          path: dist/*.apk
          if-no-files-found: error

  release:
    name: GitHub release
    if: github.ref_type == 'tag'
    needs: [macos, windows, linux, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The whole history and the tags: the release notes list the commits since the previous release.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: octopus-*
          merge-multiple: true

      # Generate release notes once so GitHub Releases and Octopus Server share the same changelog. They list every
      # commit since the previous release: GitHub's generated notes only list merged pull requests, and most changes
      # go straight to main. GitHub's notes are the fallback if the script fails.
      - name: Generate release notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! python3 tools/make-release-notes.py --tag "$GITHUB_REF_NAME" --repo "$GH_REPO" --out "$RUNNER_TEMP/release-notes.md"; then
            echo "::warning::tools/make-release-notes.py failed; falling back to GitHub's generated notes."
            gh api "repos/$GH_REPO/releases/generate-notes" \
              -f tag_name="$GITHUB_REF_NAME" \
              --jq '.body' > "$RUNNER_TEMP/release-notes.md" || true
          fi
          cat "$RUNNER_TEMP/release-notes.md" || true

      # update.json lists each platform's package with its size and SHA-256, signed with UPDATE_SIGNING_KEY
      # (design/10-自动更新.md §5). Installs only take a release whose manifest is signed by a key they trust.
      - name: Update manifest (GitHub release)
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          if [ -z "$UPDATE_SIGNING_KEY" ]; then
            echo "::warning::UPDATE_SIGNING_KEY is not set: no update manifest, so installed copies will not update to this release."
            exit 0
          fi
          KEY="$RUNNER_TEMP/update-signing-key.pem"
          ( umask 077; printf '%s\n' "$UPDATE_SIGNING_KEY" > "$KEY" )
          python3 tools/make-update-manifest.py --tag "$GITHUB_REF_NAME" --dist dist --repo "$GITHUB_REPOSITORY" --key "$KEY"
          rm -f "$KEY"

      # Compress Windows/Linux update installers and publish to Octopus Server (https://octoterm.si).
      - name: Publish to Octopus Server
        env:
          OCTOPUS_RELEASE_TOKEN: ${{ secrets.OCTOPUS_RELEASE_TOKEN }}
          OCTOPUS_RELEASE_SERVER: ${{ vars.OCTOPUS_RELEASE_SERVER || 'https://octoterm.si' }}
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          if [ -z "$OCTOPUS_RELEASE_TOKEN" ]; then
            echo "::warning::OCTOPUS_RELEASE_TOKEN is not set: skipping publish to $OCTOPUS_RELEASE_SERVER."
            exit 0
          fi
          KEY_ARGS=()
          if [ -n "$UPDATE_SIGNING_KEY" ]; then
            KEY="$RUNNER_TEMP/server-update-signing-key.pem"
            ( umask 077; printf '%s\n' "$UPDATE_SIGNING_KEY" > "$KEY" )
            KEY_ARGS=(--key "$KEY")
          fi
          python3 tools/publish-release-server.py \
            --tag "$GITHUB_REF_NAME" \
            --dist dist \
            --server "$OCTOPUS_RELEASE_SERVER" \
            --repo "$GITHUB_REPOSITORY" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            "${KEY_ARGS[@]}"
          rm -f "$RUNNER_TEMP/server-update-signing-key.pem"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          PRERELEASE=()
          case "$GITHUB_REF_NAME" in *-*) PRERELEASE=(--prerelease) ;; esac
          if [ -s "$RUNNER_TEMP/release-notes.md" ]; then
            gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/release-notes.md" "${PRERELEASE[@]}"
          else
            gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes "${PRERELEASE[@]}"
          fi
